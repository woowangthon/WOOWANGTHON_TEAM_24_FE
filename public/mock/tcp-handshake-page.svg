<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040" role="img" aria-labelledby="title desc">
  <title id="title">TCP 연결 설정 과정 강의 슬라이드</title>
  <desc id="desc">클라이언트와 서버 사이에서 SYN, SYN-ACK, ACK가 오가는 순서도</desc>
  <rect width="800" height="1040" fill="#ffffff"/>
  <rect x="48" y="48" width="704" height="944" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#111827">TCP 연결 설정 과정</text>
  <text x="230" y="230" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Client</text>
  <text x="570" y="230" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Server</text>
  <line x1="230" y1="260" x2="230" y2="830" stroke="#64748b" stroke-width="4"/>
  <line x1="570" y1="260" x2="570" y2="830" stroke="#64748b" stroke-width="4"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4f46e5"/>
    </marker>
  </defs>
  <line x1="240" y1="360" x2="550" y2="430" stroke="#4f46e5" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#111827">1. SYN</text>
  <line x1="560" y1="520" x2="250" y2="590" stroke="#4f46e5" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="400" y="530" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#111827">2. SYN-ACK</text>
  <line x1="240" y1="680" x2="550" y2="750" stroke="#4f46e5" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="400" y="690" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#111827">3. ACK</text>
  <text x="400" y="900" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#475569">3-way handshake로 연결을 설정합니다.</text>
</svg>
